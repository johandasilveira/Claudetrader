# Déploiement complet sur un serveur : IB Gateway (auto-login via IBC) + le bot.
# Réglages : settings.env (versionné, sans secret) puis .env (local : identifiants), qui a priorité.
name: claudetrader

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    env_file:
      - settings.env
      - .env
    environment:
      # TWS_USERID / TWS_PASSWORD / JAVA_HEAP_SIZE / VNC_SERVER_PASSWORD viennent de .env ;
      # TRADING_MODE / AUTO_RESTART_TIME / TIME_ZONE / TZ de settings.env.
      READ_ONLY_API: no
      TWS_ACCEPT_INCOMING: accept
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      TWOFA_EXIT_INTERVAL: 180
      BYPASS_WARNING: "yes"
      EXISTING_SESSION_DETECTED_ACTION: primary
      # Scripts exécutés avant la génération de la config IBC (voir deploy/gateway-init/).
      X_SCRIPTS: init-scripts
    volumes:
      - gateway_settings:/home/ibgateway/tws_settings
      - ./deploy/gateway-init:/home/ibgateway/init-scripts:ro
    ports:
      # Exposés uniquement sur la boucle locale du serveur : jamais sur Internet.
      - "127.0.0.1:4001:4003"   # API live
      - "127.0.0.1:4002:4004"   # API paper
      - "127.0.0.1:5900:5900"   # VNC (voir la fenêtre de la passerelle via un tunnel SSH)
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4003 || </dev/tcp/127.0.0.1/4004'"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

  bot:
    build: .
    restart: always
    depends_on:
      ib-gateway:
        condition: service_healthy
    env_file:
      - settings.env
      - .env
    environment:
      # Dans le réseau Docker la passerelle s'appelle ib-gateway ; 4003 = live, 4004 = paper.
      IB_HOST: ib-gateway
      IB_PORT: ${IB_PORT_DOCKER:-4003}
      JOURNAL_PATH: /app/data/journal.jsonl
    volumes:
      - ./data:/app/data

volumes:
  gateway_settings:
